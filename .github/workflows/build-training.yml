name: Build Training Ollama


on:

  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

  push:
    branches:
      - training


permissions:

  contents: write



jobs:


  build:


    runs-on: ubuntu-latest



    steps:


      # -------------------------
      # Checkout training branch
      # -------------------------

      - name: Checkout training branch

        uses: actions/checkout@v4

        with:

          ref: training

          fetch-depth: 0

          token: ${{ secrets.PAT_TOKEN }}



      # -------------------------
      # Git config
      # -------------------------

      - name: Configure Git

        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"



      # -------------------------
      # Add upstream
      # -------------------------

      - name: Add upstream

        run: |

          git remote add upstream https://github.com/ollama/ollama.git || true



      # -------------------------
      # Fetch upstream
      # -------------------------

      - name: Fetch upstream

        run: |

          git fetch upstream main



      # -------------------------
      # Update from Ollama
      # -------------------------

      - name: Rebase upstream

        run: |

          git rebase upstream/main || {

            echo "Rebase conflict"

            git rebase --abort

            exit 1

          }



      # -------------------------
      # Apply patch
      # -------------------------

      - name: Patch llama-server name

        run: |

          chmod +x scripts/patch-training-server.sh

          scripts/patch-training-server.sh



      # -------------------------
      # Commit patch
      # -------------------------

      - name: Commit patch

        run: |

          git add llm/llama_server.go

          git commit \
            -m "patch llama-server to training-server" \
            || echo "No patch changes"



      # -------------------------
      # Push training branch
      # -------------------------

      - name: Push training branch

        run: |

          git push origin training --force-with-lease



      # -------------------------
      # Setup Go
      # -------------------------

      - name: Setup Go

        uses: actions/setup-go@v5

        with:

          go-version: "1.24"

          cache: false



      # -------------------------
      # Build Ollama
      # -------------------------

      - name: Build Ollama

        run: |

          mkdir -p dist


          go generate ./...


          go build \
            -o dist/ollama \
            .



      # -------------------------
      # Verify
      # -------------------------

      - name: Verify binary

        run: |

          ls -lh dist

          file dist/ollama



      # -------------------------
      # Package
      # -------------------------

      - name: Package release

        run: |

          mkdir -p release


          cp dist/ollama release/


          tar czvf \
            training-ollama-linux-amd64.tar.gz \
            -C release .



      # -------------------------
      # Upload artifact
      # -------------------------

      - name: Upload Artifact

        uses: actions/upload-artifact@v4

        with:

          name: training-ollama-linux-amd64

          path:

            training-ollama-linux-amd64.tar.gz



      # -------------------------
      # Generate release tag
      # -------------------------

      - name: Generate Release Tag

        id: release

        run: |

          echo "tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT



      # -------------------------
      # Create GitHub Release
      # -------------------------

      - name: Create Release

        uses: softprops/action-gh-release@v2

        with:

          tag_name: ${{ steps.release.outputs.tag }}

          name: Training Ollama ${{ steps.release.outputs.tag }}

          draft: false

          prerelease: false

          body: |

            Automated Training Ollama build.


            Source:

            - Upstream: ollama/ollama

            Changes:

            - Sync upstream main

            - Patch llama-server -> training-server

            - Build Linux amd64 binary


          files:

            training-ollama-linux-amd64.tar.gz
